services:
  app:
    build:
      context: .
      args:
        APP: app
    ports:
      - "${APP_PORT:-8081}:8081"
    init: true
    restart: unless-stopped

  cms:
    build:
      context: .
      args:
        APP: cms
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dummy_repo}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-local-development-only-change-me}
    ports:
      - "${CMS_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dummy_repo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
